name: PR Review Intake

on:
  pull_request:
    types: [labeled]

permissions: {}

jobs:
  request:
    if: contains(fromJSON('["mgmt-review-needed"]'), github.event.label.name)
    runs-on: ubuntu-slim
    timeout-minutes: 5
    steps:
      # This is only a wake-up signal. The router authorizes GitHub label events.
      - name: Signal a review request
        run: echo "PR review requested."
