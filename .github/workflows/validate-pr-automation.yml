name: Validate PR Automation

on:
  pull_request:
    paths:
      - '.github/workflows/**'
      - 'eng/tools/pr-review/**'
  push:
    branches: [main]
    paths:
      - '.github/workflows/**'
      - 'eng/tools/pr-review/**'

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
      - run: node --test eng/tools/pr-review/workflow.test.cjs
