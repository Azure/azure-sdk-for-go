parameters:
  - name: languageRepoResource
    type: string
  - name: toolsRef
    type: string
  - name: languageToolsRef
    type: string
  - name: poolName
    type: string
    default: 'azsdk-pool'
  - name: imageOverride
    type: string
    default: 'ubuntu-24.04'

jobs:
  - template: /eng/common/pipelines/templates/jobs/apireview-hub-build-tools-base.yml
    parameters:
      languageRepoResource: ${{ parameters.languageRepoResource }}
      toolsRef: ${{ parameters.toolsRef }}
      languageToolsRef: ${{ parameters.languageToolsRef }}
      poolName: ${{ parameters.poolName }}
      imageOverride: ${{ parameters.imageOverride }}
      stepList:
        - task: GoTool@0
          displayName: Select Go version
          inputs:
            version: $(GO_VERSION_LATEST)

        - pwsh: |
            $ErrorActionPreference = 'Stop'
            & (Join-Path $env:LANGUAGE_TOOLS_SOURCE_DIRECTORY 'eng/scripts/Build-APIReviewTools.ps1') `
              -ToolsSourceDirectory $env:TOOLS_SOURCE_DIRECTORY `
              -LanguageToolsSourceDirectory $env:LANGUAGE_TOOLS_SOURCE_DIRECTORY `
              -BinOutputDirectory $env:BIN_OUTPUT_DIRECTORY
          displayName: Build Go API review tooling
          env:
            TOOLS_SOURCE_DIRECTORY: $(ToolsSourceDirectory)
            LANGUAGE_TOOLS_SOURCE_DIRECTORY: $(LanguageToolsSourceDirectory)
            BIN_OUTPUT_DIRECTORY: $(BinOutputDirectory)