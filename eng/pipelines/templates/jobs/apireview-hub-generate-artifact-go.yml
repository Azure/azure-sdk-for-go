parameters:
  - name: kind
    type: string
    values:
      - base
      - target
  - name: requestMode
    type: string
    values:
      - create
      - update
  - name: repositoryOwner
    type: string
    default: Azure
  - name: ref
    type: string
  - name: packageName
    type: string
  - name: operationId
    type: string
  - name: poolName
    type: string
    default: 'azsdk-pool'
  - name: imageOverride
    type: string
    default: 'ubuntu-24.04'

jobs:
  - template: /eng/common/pipelines/templates/jobs/apireview-hub-generate-artifact-base.yml
    parameters:
      ${{ if eq(parameters.kind, 'base') }}:
        jobName: GenerateBase
      ${{ if eq(parameters.kind, 'target') }}:
        jobName: GenerateTarget
      kind: ${{ parameters.kind }}
      requestMode: ${{ parameters.requestMode }}
      language: go
      repositoryFullName: ${{ format('{0}/{1}', parameters.repositoryOwner, 'azure-sdk-for-go') }}
      ref: ${{ parameters.ref }}
      packageName: ${{ parameters.packageName }}
      operationId: ${{ parameters.operationId }}
      poolName: ${{ parameters.poolName }}
      imageOverride: ${{ parameters.imageOverride }}
      stepList:
        - task: GoTool@0
          displayName: Select Go version
          inputs:
            version: $(GO_VERSION_LATEST)
        - pwsh: |
            $ErrorActionPreference = 'Stop'
            & (Join-Path $env:BIN_DIRECTORY 'Build-APIReviewHubTools.ps1') `
              -SourceRoot $env:SOURCE_DIRECTORY `
              -RepositoryFullName $env:REPOSITORY_FULL_NAME `
              -TargetCommit $env:TARGET_COMMIT `
              -Kind $env:REVIEW_KIND `
              -ToolsDirectory $env:BIN_DIRECTORY `
              -WorkingDirectory $env:AGENT_TEMPDIRECTORY
          displayName: Build Go tools from the target commit
          env:
            SOURCE_DIRECTORY: $(Build.SourcesDirectory)
            BIN_DIRECTORY: $(BinDirectory)
            REPOSITORY_FULL_NAME: ${{ format('{0}/{1}', parameters.repositoryOwner, 'azure-sdk-for-go') }}
            TARGET_COMMIT: $(ApiReviewTargetCommit)
            REVIEW_KIND: ${{ parameters.kind }}
        - pwsh: |
            $ErrorActionPreference = 'Stop'
            $parserName = if ($IsWindows) { 'apiviewgo.exe' } else { 'apiviewgo' }
            $parserPath = Join-Path $env:BIN_DIRECTORY $parserName
            if (-not $IsWindows) {
              & chmod +x $parserPath
              if ($LASTEXITCODE -ne 0) {
                throw "Failed to make the Go APIView parser executable."
              }
            }
            & (Join-Path $env:BIN_DIRECTORY 'Export-APIReviewBundle.ps1') `
              -SourceRoot $env:SOURCE_DIRECTORY `
              -PackageName $env:PACKAGE_NAME `
              -OutputDirectory $env:ARTIFACT_OUTPUT_DIRECTORY `
              -ParserPath $parserPath | Out-Null
          displayName: Generate ${{ parameters.kind }} Go API review bundle
          env:
            SOURCE_DIRECTORY: $(Build.SourcesDirectory)
            BIN_DIRECTORY: $(BinDirectory)
            ARTIFACT_OUTPUT_DIRECTORY: $(ArtifactOutputDirectory)
            PACKAGE_NAME: ${{ parameters.packageName }}
