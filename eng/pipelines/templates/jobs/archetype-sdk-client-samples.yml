parameters:
  - name: ServiceDirectory
    type: string
    default: ''
  - name: TestRunTime
    type: string
    default: '600s'

stages:
  - stage: Build
    jobs:
    - job: Build
      displayName: Build on
      variables:
        - template: /eng/pipelines/templates/variables/globals.yml
        - template: /eng/pipelines/templates/variables/image.yml
      strategy:
        matrix:
          Linux_GoPrevious:
            pool.name: $(LINUXPOOL)
            image.name: $(LINUXVMIMAGE)
            go.version: $(GO_VERSION_PREVIOUS)
          Windows_GoPrevious:
            pool.name: $(WINDOWSPOOL)
            image.name: $(WINDOWSVMIMAGE)
            go.version: $(GO_VERSION_PREVIOUS)
          Linux_GoLatest:
            pool.name: $(LINUXPOOL)
            image.name: $(LINUXVMIMAGE)
            go.version: $(GO_VERSION_LATEST)
          Windows_GoLatest:
            pool.name: $(WINDOWSPOOL)
            image.name: $(WINDOWSVMIMAGE)
            go.version: $(GO_VERSION_LATEST)
      pool:
        name: $(pool.name)
        demands: ImageOverride -equals '$(image.name)'
      steps:
      - template: /eng/common/pipelines/templates/steps/verify-agent-os.yml
        parameters:
          AgentImage: $(image.name)

      - task: GoTool@0
        inputs:
          version: '$(go.version)'
        displayName: "Select Go Version"

      - template: ../steps/create-go-workspace.yml

      - template: ../steps/build-test.yml
        parameters:
          ServiceDirectory: ${{ parameters.ServiceDirectory }}
          Image: $(image.name)
          GoVersion: $(go.version)
          TestRunTime: ${{ parameters.TestRunTime }}

    - job: Analyze
      displayName: Analyze
      variables:
        - template: /eng/pipelines/templates/variables/globals.yml
        - template: /eng/pipelines/templates/variables/image.yml
      pool:
        name: $(LINUXPOOL)
        demands: ImageOverride -equals '$(LINUXVMIMAGE)'

      steps:
      - task: GoTool@0
        inputs:
          version: '$(GO_VERSION_LATEST)'
        displayName: "Select Go Version"

      - template: ../steps/create-go-workspace.yml

      - template: ../steps/analyze.yml
        parameters:
          ServiceDirectory: ${{ parameters.ServiceDirectory }}
          LintVersion: $(GoLintCLIVersion)

