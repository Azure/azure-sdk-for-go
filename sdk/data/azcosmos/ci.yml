# NOTE: Please refer to https://aka.ms/azsdk/engsys/ci-yaml before editing this file.
trigger:
  branches:
    include:
      - main
      - hotfix/*
      - release/*
  paths:
    include:
    - sdk/data/azcosmos/

pr:
  branches:
    include:
      - main
      - feature/*
      - hotfix/*
      - release/*
  paths:
    include:
    - sdk/data/azcosmos/

extends:
  template: /eng/pipelines/templates/jobs/archetype-sdk-client.yml
  parameters:
    ServiceDirectory: 'data/azcosmos'
    UsePipelineProxy: false
    AdditionalStages:
      - stage: Emulator
        displayName: 'Cosmos Emulator'
        variables:
        - template: /eng/pipelines/templates/variables/globals.yml@self
        - template: /eng/pipelines/templates/variables/image.yml@self
        jobs:
        - job: DownloadAndRunCosmosEmulator
          displayName: Download and run Cosmos Emulator

          pool:
            name: $(WINDOWSPOOL)
            image: $(WINDOWSVMIMAGE)
            os: windows

          steps:
          - template: /eng/common/pipelines/templates/steps/cosmos-emulator.yml@self
            parameters:
              StartParameters: '/noexplorer /noui /enablepreview /disableratelimiting /enableaadauthentication /partitioncount=50 /consistency=Strong /EnableSqlComputeEndpoint'
          - powershell: |
              $Key = 'C2y6yDjf5/R+ob0N8A7Cgv30VRDJIWEHLM+4QDU5DE2nQ9nDuVTqobD4b8mGGyPMbIZnqyMsEcaGQy67XIw/Jw=='
              $password = ConvertTo-SecureString -String $Key -Force -AsPlainText
              $cert = Get-ChildItem cert:\LocalMachine\My | Where-Object { $_.FriendlyName -eq "DocumentDbEmulatorCertificate" }
              Export-PfxCertificate -Cert $cert -FilePath ".\CosmosDbEmulatorCert.pfx" -Password $password | Out-Null
              $cert = New-Object System.Security.Cryptography.X509Certificates.X509Certificate2
              $cert.Import(".\CosmosDbEmulatorCert.pfx", $Key, "DefaultKeySet")
              $cert | Export-Certificate -FilePath "$env:temp\CosmosDbEmulatorCert.cer" -Type CERT
            displayName: 'Export Cosmos DB Emulator Certificate'
          - template: /eng/common/pipelines/templates/steps/verify-agent-os.yml@self
            parameters:
              AgentImage: windows

          - task: GoTool@0
            inputs:
              version: '1.26.1'
            displayName: "Select Go Version"

          - template: /eng/pipelines/templates/steps/create-go-workspace.yml@self

          - template:  /eng/pipelines/templates/steps/build-test.yml@self
            parameters:
              ServiceDirectory: 'data/azcosmos'
              Image: $(vm.image)
              GoVersion: '1.26.1'
              EnableRaceDetector: true
              EnvVars:
                EMULATOR: 'true'

      # The v2 driver binding needs a native library and a build tag, neither of which the stage
      # above provides, so it runs separately rather than complicating that one.
      #
      # The library and the emulator are committed under internal/native/lib rather than built
      # here. Building them needs crates.io, which the agents cannot reach, and the distribution
      # design puts these binaries in their own modules in a separate repository anyway. That
      # repository does not yet carry a module for this platform, so the committed copies stand in
      # until it does. This stage is expected to shrink to a module dependency at that point.
      - stage: DriverEmulator
        displayName: 'Cosmos Emulator (v2 driver)'
        # A stage with no dependsOn implicitly depends on the one before it, which would queue this
        # behind the Windows emulator stage above and skip it entirely whenever that stage fails.
        # This stage shares nothing with it: it builds what it needs itself, from binaries that are
        # already in the tree. An empty dependsOn is what makes that independence explicit.
        dependsOn: []
        variables:
        - template: /eng/pipelines/templates/variables/globals.yml@self
        - template: /eng/pipelines/templates/variables/image.yml@self
        - name: DriverLibDir
          value: $(Build.SourcesDirectory)/sdk/data/azcosmos/internal/native/lib/linux_amd64
        # cgo rejects executable-relative rpaths by default, and the driver modules use them so a
        # library shipped beside a binary wins over the path it was built from.
        - name: CgoRpathAllow
          value: '^-Wl,-rpath,(@(executable_path|loader_path)|\$ORIGIN)$'
        jobs:
        - job: RunDriverEmulatorTests
          displayName: Run the driver emulator tests

          pool:
            name: $(LINUXPOOL)
            image: $(LINUXVMIMAGE)
            os: linux

          steps:
          - template: /eng/common/pipelines/templates/steps/verify-agent-os.yml@self
            parameters:
              AgentImage: ubuntu

          # The committed artifacts are verified before anything is made executable or run, because
          # one of them is an executable this stage launches on the agent. A binary is not
          # reviewable in a diff, so the checksums are what a reviewer is actually approving.
          - script: |
              set -euo pipefail
              cd sdk/data/azcosmos/internal/native/lib
              sha256sum -c SHA256SUMS

              # Reads the Mach-O load command rather than shelling out to otool, which the linux
              # agent does not have.
              python3 check-install-name.py darwin_arm64/libazurecosmosdriver.dylib
            displayName: 'Verify the committed driver artifacts'

          # Fail here rather than leaving the tests to fail at link time with a less obvious
          # message.
          - script: |
              set -euo pipefail
              test -f "$(DriverLibDir)/libazurecosmosdriver.so"
              test -f "$(DriverLibDir)/azure_data_cosmos_emulator"
              chmod +x "$(DriverLibDir)/azure_data_cosmos_emulator"
              file "$(DriverLibDir)/libazurecosmosdriver.so"
            displayName: 'Check the committed driver artifacts'

          # The emulator writes one JSON record to stdout once every listener is bound, and logs to
          # stderr, so the endpoint is read from that record rather than guessed. Its config asks
          # for an OS-assigned port, so nothing collides with whatever else is on the agent.
          - script: |
              set -euo pipefail
              config='sdk/data/azcosmos/internal/testdata/emulator-config.json'
              nohup "$(DriverLibDir)/azure_data_cosmos_emulator" --config "$config" \
                > "$(Agent.TempDirectory)/emulator-ready.json" \
                2> "$(Agent.TempDirectory)/emulator.log" &

              for _ in $(seq 1 60); do
                if grep -q '"event":"ready"' "$(Agent.TempDirectory)/emulator-ready.json" 2>/dev/null; then
                  endpoint=$(python3 -c "import json,sys; print(json.load(open(sys.argv[1]))['accountEndpoint'])" \
                    "$(Agent.TempDirectory)/emulator-ready.json")
                  echo "emulator ready at $endpoint"
                  echo "##vso[task.setvariable variable=EmulatorEndpoint]$endpoint"
                  exit 0
                fi
                sleep 1
              done
              echo '##[error] The emulator did not become ready.'
              tail -50 "$(Agent.TempDirectory)/emulator.log" || true
              exit 1
            displayName: 'Start the in-memory Cosmos emulator'

          - task: GoTool@0
            inputs:
              version: '1.26.1'
            displayName: "Select Go Version"

          - template: /eng/pipelines/templates/steps/create-go-workspace.yml@self

          # The shared template forwards EnvVars only to its test step, so its own build and vet
          # steps would compile the stub and leave the binding unchecked. Nothing else in the
          # repository builds with this tag, so without this the cgo code is never vetted at all.
          - script: |
              set -euo pipefail
              cd sdk/data/azcosmos
              go build -tags=azcosmos_driver ./...
              go vet -tags=azcosmos_driver ./...
            displayName: 'Build and vet the driver binding'
            env:
              CGO_ENABLED: '1'
              CGO_LDFLAGS_ALLOW: $(CgoRpathAllow)

          - template:  /eng/pipelines/templates/steps/build-test.yml@self
            parameters:
              ServiceDirectory: 'data/azcosmos'
              Image: $(vm.image)
              GoVersion: '1.26.1'
              EnableRaceDetector: true
              EnvVars:
                EMULATOR: 'true'
                AZCOSMOS_ENDPOINT: $(EmulatorEndpoint)
                # The binding is behind a build tag, and the shared test template has no parameter
                # for one, so it is injected through the go command's own environment variable
                # rather than by changing a template the Go central team owns.
                GOFLAGS: '-tags=azcosmos_driver'
                CGO_ENABLED: '1'
                CGO_LDFLAGS_ALLOW: $(CgoRpathAllow)
                # The library directory is deliberately not an rpath in the shipped link line, so
                # the test binary — which is built into a temporary directory, not next to the
                # library — needs the loader pointed at it here. See cgo_native.go.
                LD_LIBRARY_PATH: $(DriverLibDir)
