# NOTE: Please refer to https://aka.ms/azsdk/engsys/ci-yaml before editing this file.
trigger:
  branches:
    include:
      - main
      - hotfix/*
      - release/*
  paths:
    include:
    - sdk/data/azcosmos/

pr:
  branches:
    include:
      - main
      - feature/*
      - hotfix/*
      - release/*
  paths:
    include:
    - sdk/data/azcosmos/

extends:
  template: /eng/pipelines/templates/jobs/archetype-sdk-client.yml
  parameters:
    ServiceDirectory: 'data/azcosmos'
    UsePipelineProxy: false
    AdditionalStages:
      - stage: Emulator
        displayName: 'Cosmos Emulator'
        variables:
        - template: /eng/pipelines/templates/variables/globals.yml@self
        - template: /eng/pipelines/templates/variables/image.yml@self
        jobs:
        - job: DownloadAndRunCosmosEmulator
          displayName: Download and run Cosmos Emulator

          pool:
            name: $(WINDOWSPOOL)
            image: $(WINDOWSVMIMAGE)
            os: windows

          steps:
          - template: /eng/common/pipelines/templates/steps/cosmos-emulator.yml@self
            parameters:
              StartParameters: '/noexplorer /noui /enablepreview /disableratelimiting /enableaadauthentication /partitioncount=50 /consistency=Strong /EnableSqlComputeEndpoint'
          - powershell: |
              $Key = 'C2y6yDjf5/R+ob0N8A7Cgv30VRDJIWEHLM+4QDU5DE2nQ9nDuVTqobD4b8mGGyPMbIZnqyMsEcaGQy67XIw/Jw=='
              $password = ConvertTo-SecureString -String $Key -Force -AsPlainText
              $cert = Get-ChildItem cert:\LocalMachine\My | Where-Object { $_.FriendlyName -eq "DocumentDbEmulatorCertificate" }
              Export-PfxCertificate -Cert $cert -FilePath ".\CosmosDbEmulatorCert.pfx" -Password $password | Out-Null
              $cert = New-Object System.Security.Cryptography.X509Certificates.X509Certificate2
              $cert.Import(".\CosmosDbEmulatorCert.pfx", $Key, "DefaultKeySet")
              $cert | Export-Certificate -FilePath "$env:temp\CosmosDbEmulatorCert.cer" -Type CERT
            displayName: 'Export Cosmos DB Emulator Certificate'
          - template: /eng/common/pipelines/templates/steps/verify-agent-os.yml@self
            parameters:
              AgentImage: windows

          - task: GoTool@0
            inputs:
              version: '1.26.1'
            displayName: "Select Go Version"

          - template: /eng/pipelines/templates/steps/create-go-workspace.yml@self

          - template:  /eng/pipelines/templates/steps/build-test.yml@self
            parameters:
              ServiceDirectory: 'data/azcosmos'
              Image: $(vm.image)
              GoVersion: '1.26.1'
              EnableRaceDetector: true
              EnvVars:
                EMULATOR: 'true'

      # Driver archives come from platform Go modules; the test emulator is built from pinned Rust source.
      - stage: DriverEmulator
        displayName: 'Cosmos Emulator (v2 driver)'
        # A stage with no dependsOn implicitly depends on the one before it, which would queue this
        # behind the Windows emulator stage above and skip it entirely whenever that stage fails.
        # This stage builds its own emulator. An empty dependsOn makes that independence explicit.
        dependsOn: []
        variables:
        - template: /eng/pipelines/templates/variables/globals.yml@self
        - template: /eng/pipelines/templates/variables/image.yml@self
        - name: EmulatorBinDir
          value: $(Agent.TempDirectory)/cosmos-emulator-target/release
        - name: EmulatorSourceRevision
          value: a05f024d22cd0a70f6ccac5e310cbbbaf40bf20e
        - name: EmulatorRustVersion
          value: '1.95.0'
        jobs:
        - job: RunDriverEmulatorTests
          displayName: Run the driver emulator tests

          pool:
            name: $(LINUXPOOL)
            image: $(LINUXVMIMAGE)
            os: linux

          steps:
          - template: /eng/common/pipelines/templates/steps/verify-agent-os.yml@self
            parameters:
              AgentImage: ubuntu

          - script: |
              set -euo pipefail
              if ! command -v rustup >/dev/null 2>&1; then
                curl --fail --show-error --silent --location --proto '=https' --tlsv1.2 \
                  https://sh.rustup.rs -o "$(Agent.TempDirectory)/cosmos-rustup-init.sh"
                sh "$(Agent.TempDirectory)/cosmos-rustup-init.sh" \
                  -y --no-modify-path --profile minimal --default-toolchain none
                export PATH="$HOME/.cargo/bin:$PATH"
              fi
              rustup toolchain install "$(EmulatorRustVersion)" --profile minimal

              source="$(Agent.TempDirectory)/cosmos-emulator-source"
              git init --quiet "$source"
              git -C "$source" fetch --depth=1 https://github.com/Azure/azure-sdk-for-rust.git \
                "$(EmulatorSourceRevision)"
              git -C "$source" checkout --detach FETCH_HEAD
              test "$(git -C "$source" rev-parse HEAD)" = "$(EmulatorSourceRevision)"
              cd "$source"
              cargo +"$(EmulatorRustVersion)" build --locked --release \
                -p azure_data_cosmos_emulator \
                --target-dir "$(Agent.TempDirectory)/cosmos-emulator-target"
            displayName: 'Build the emulator from pinned Rust source'

          # Fail here rather than leaving the tests to fail with a less obvious message.
          - script: |
              set -euo pipefail
              test -f "$(EmulatorBinDir)/azure_data_cosmos_emulator"
              test -x "$(EmulatorBinDir)/azure_data_cosmos_emulator"
              file "$(EmulatorBinDir)/azure_data_cosmos_emulator"
            displayName: 'Check the built emulator executable'

          # The emulator writes one JSON record to stdout once every listener is bound, and logs to
          # stderr, so the endpoint is read from that record rather than guessed. Its config asks
          # for an OS-assigned port, so nothing collides with whatever else is on the agent.
          - script: |
              set -euo pipefail
              config='sdk/data/azcosmos/internal/testdata/emulator-config.json'
              nohup "$(EmulatorBinDir)/azure_data_cosmos_emulator" --config "$config" \
                > "$(Agent.TempDirectory)/emulator-ready.json" \
                2> "$(Agent.TempDirectory)/emulator.log" &

              for _ in $(seq 1 60); do
                if grep -q '"event":"ready"' "$(Agent.TempDirectory)/emulator-ready.json" 2>/dev/null; then
                  endpoint=$(python3 -c "import json,sys; print(json.load(open(sys.argv[1]))['accountEndpoint'])" \
                    "$(Agent.TempDirectory)/emulator-ready.json")
                  echo "emulator ready at $endpoint"
                  echo "##vso[task.setvariable variable=EmulatorEndpoint]$endpoint"
                  exit 0
                fi
                sleep 1
              done
              echo '##[error] The emulator did not become ready.'
              tail -50 "$(Agent.TempDirectory)/emulator.log" || true
              exit 1
            displayName: 'Start the in-memory Cosmos emulator'

          - task: GoTool@0
            inputs:
              version: '1.26.1'
            displayName: "Select Go Version"

          - template: /eng/pipelines/templates/steps/create-go-workspace.yml@self

          - template:  /eng/pipelines/templates/steps/build-test.yml@self
            parameters:
              ServiceDirectory: 'data/azcosmos'
              Image: $(vm.image)
              GoVersion: '1.26.1'
              EnableRaceDetector: true
              EnvVars:
                EMULATOR: 'true'
                AZCOSMOS_ENDPOINT: $(EmulatorEndpoint)
                CGO_ENABLED: '1'
