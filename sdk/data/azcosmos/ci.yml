# NOTE: Please refer to https://aka.ms/azsdk/engsys/ci-yaml before editing this file.
trigger:
  branches:
    include:
      - main
      - hotfix/*
      - release/*
  paths:
    include:
    - sdk/data/azcosmos/

pr:
  branches:
    include:
      - main
      - feature/*
      - hotfix/*
      - release/*
  paths:
    include:
    - sdk/data/azcosmos/

extends:
  template: /eng/pipelines/templates/jobs/archetype-sdk-client.yml
  parameters:
    ServiceDirectory: 'data/azcosmos'
    UsePipelineProxy: false
    AdditionalStages:
      - stage: Emulator
        displayName: 'Cosmos Emulator'
        variables:
        - template: /eng/pipelines/templates/variables/globals.yml@self
        - template: /eng/pipelines/templates/variables/image.yml@self
        jobs:
        - job: DownloadAndRunCosmosEmulator
          displayName: Download and run Cosmos Emulator

          pool:
            name: $(WINDOWSPOOL)
            image: $(WINDOWSVMIMAGE)
            os: windows

          steps:
          - template: /eng/common/pipelines/templates/steps/cosmos-emulator.yml@self
            parameters:
              StartParameters: '/noexplorer /noui /enablepreview /disableratelimiting /enableaadauthentication /partitioncount=50 /consistency=Strong /EnableSqlComputeEndpoint'
          - powershell: |
              $Key = 'C2y6yDjf5/R+ob0N8A7Cgv30VRDJIWEHLM+4QDU5DE2nQ9nDuVTqobD4b8mGGyPMbIZnqyMsEcaGQy67XIw/Jw=='
              $password = ConvertTo-SecureString -String $Key -Force -AsPlainText
              $cert = Get-ChildItem cert:\LocalMachine\My | Where-Object { $_.FriendlyName -eq "DocumentDbEmulatorCertificate" }
              Export-PfxCertificate -Cert $cert -FilePath ".\CosmosDbEmulatorCert.pfx" -Password $password | Out-Null
              $cert = New-Object System.Security.Cryptography.X509Certificates.X509Certificate2
              $cert.Import(".\CosmosDbEmulatorCert.pfx", $Key, "DefaultKeySet")
              $cert | Export-Certificate -FilePath "$env:temp\CosmosDbEmulatorCert.cer" -Type CERT
            displayName: 'Export Cosmos DB Emulator Certificate'
          - template: /eng/common/pipelines/templates/steps/verify-agent-os.yml@self
            parameters:
              AgentImage: windows

          - task: GoTool@0
            inputs:
              version: '1.26.1'
            displayName: "Select Go Version"

          - template: /eng/pipelines/templates/steps/create-go-workspace.yml@self

          - template:  /eng/pipelines/templates/steps/build-test.yml@self
            parameters:
              ServiceDirectory: 'data/azcosmos'
              Image: $(vm.image)
              GoVersion: '1.26.1'
              EnableRaceDetector: true
              EnvVars:
                EMULATOR: 'true'

      # The v2 driver binding needs a native library, a C toolchain and a build tag, none of which
      # the stage above provides, so it runs separately rather than complicating that one.
      #
      # It is Linux rather than Windows because the driver has to be built from source: there is no
      # published binary yet, and cross-compiling one for Windows needs a toolchain the agents do
      # not carry. The vNext emulator ships as a Linux container, so the whole stage stays on one
      # platform.
      - stage: DriverEmulator
        displayName: 'Cosmos Emulator (v2 driver)'
        variables:
        - template: /eng/pipelines/templates/variables/globals.yml@self
        - template: /eng/pipelines/templates/variables/image.yml@self
        # Pinned rather than floating: the C ABI is only guaranteed compatible within a version,
        # and this has to move in lockstep with nativeDriverVersion in driver.go.
        - name: DriverRepoCommit
          value: 2bc179cf6ff5c22e249fd10d944c8e946bb712d2
        - name: DriverLibDir
          value: $(Agent.TempDirectory)/cosmos-driver/target/release
        jobs:
        - job: BuildDriverAndRunEmulator
          displayName: Build the driver and run the emulator tests

          pool:
            name: $(LINUXPOOL)
            image: $(LINUXVMIMAGE)
            os: linux

          steps:
          - template: /eng/common/pipelines/templates/steps/verify-agent-os.yml@self
            parameters:
              AgentImage: ubuntu

          - script: |
              set -euo pipefail
              git clone --filter=blob:none --no-checkout \
                https://github.com/Azure/azure-sdk-for-rust.git "$(Agent.TempDirectory)/cosmos-driver"
              cd "$(Agent.TempDirectory)/cosmos-driver"
              git checkout $(DriverRepoCommit)
            displayName: 'Fetch the Cosmos driver source'

          - script: |
              set -euo pipefail
              cd "$(Agent.TempDirectory)/cosmos-driver/sdk/cosmos/azure_data_cosmos_driver_native"
              cargo build --release
              # Fail loudly here rather than leaving the tests to fail at link time with a less
              # obvious message.
              test -f "$(DriverLibDir)/libazurecosmosdriver.so"
            displayName: 'Build the Cosmos driver'

          # The header the binding compiles against is vendored, so it has to match the library it
          # links against. A mismatch is an ABI mismatch, which fails at runtime rather than at
          # build time and is worth catching here.
          - script: |
              set -euo pipefail
              vendored='sdk/data/azcosmos/internal/native/azurecosmosdriver.h'
              upstream="$(Agent.TempDirectory)/cosmos-driver/sdk/cosmos/azure_data_cosmos_driver_native/include/azurecosmosdriver.h"
              if ! diff -u "$vendored" "$upstream"; then
                echo "##[error] The vendored header does not match the driver at $(DriverRepoCommit)."
                echo "##[error] Re-vendor it and update nativeDriverVersion in driver.go."
                exit 1
              fi
            displayName: 'Verify the vendored header matches the driver'

          - script: |
              set -euo pipefail
              docker run -d --name cosmos-emulator -p 8081:8081 \
                mcr.microsoft.com/cosmosdb/linux/azure-cosmos-emulator:vnext-preview
              # The gateway reports ready well after the container starts, so poll rather than
              # sleeping for a fixed time.
              #
              # The log is written to a file rather than piped into grep: grep -q closes the pipe
              # on its first match, which kills docker logs with SIGPIPE, and under pipefail that
              # 141 becomes the pipeline's status. A ready emulator would read as not ready.
              for _ in $(seq 1 60); do
                docker logs cosmos-emulator > emulator.log 2>&1 || true
                if grep -q 'Gateway=OK' emulator.log; then
                  echo 'emulator ready'
                  exit 0
                fi
                sleep 5
              done
              echo '##[error] The emulator did not become ready.'
              tail -50 emulator.log
              exit 1
            displayName: 'Start the Cosmos emulator'

          - task: GoTool@0
            inputs:
              version: '1.26.1'
            displayName: "Select Go Version"

          - template: /eng/pipelines/templates/steps/create-go-workspace.yml@self

          # The tests operate on an existing container, because container management is not bound
          # yet. This provisions it through the REST API so it does not depend on the code it is
          # about to exercise.
          - script: |
              set -euo pipefail
              # Run from the module directory: the repository root is not itself a module.
              cd sdk/data/azcosmos
              go run ./internal/testdata/provision
            displayName: 'Provision the test database and container'
            env:
              AZCOSMOS_ENDPOINT: 'http://localhost:8081'

          # The shared template forwards EnvVars only to its test step, so its own build and vet
          # steps would compile the stub and leave the binding unchecked. Nothing else in the
          # repository builds with this tag, so without this the cgo code is never vetted at all.
          # Vetting does not link, so it needs no library on the path.
          - script: |
              set -euo pipefail
              cd sdk/data/azcosmos
              go build -tags=azcosmos_driver ./...
              go vet -tags=azcosmos_driver ./...
            displayName: 'Build and vet the driver binding'
            env:
              CGO_ENABLED: '1'
              CGO_LDFLAGS: '-L$(DriverLibDir)'

          - template:  /eng/pipelines/templates/steps/build-test.yml@self
            parameters:
              ServiceDirectory: 'data/azcosmos'
              Image: $(vm.image)
              GoVersion: '1.26.1'
              EnableRaceDetector: true
              EnvVars:
                EMULATOR: 'true'
                # The vNext emulator serves plain HTTP, unlike the Windows one.
                AZCOSMOS_ENDPOINT: 'http://localhost:8081'
                # The binding is behind a build tag, and the shared test template has no parameter
                # for one, so it is injected through the go command's own environment variable
                # rather than by changing a template the Go central team owns.
                GOFLAGS: '-tags=azcosmos_driver'
                CGO_ENABLED: '1'
                CGO_LDFLAGS: '-L$(DriverLibDir)'
                LD_LIBRARY_PATH: '$(DriverLibDir)'
