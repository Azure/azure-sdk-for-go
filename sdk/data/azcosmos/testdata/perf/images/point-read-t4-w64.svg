<title id="title">W64 - T4 extension</title>
<desc id="description">Four zero-based horizontal bar charts show reads per second, process CPU microseconds per read, mean repeat p99 latency and whole-process RSS. Each chart uses only rows from one run. Two repeats per cell; not a confidence interval. Scales are shared with the other run chart.</desc>
